<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Collection Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .album-card {
            transition: transform 0.3s ease;
            margin-bottom: 20px;
            height: 100%;
        }
        .album-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .album-cover {
            height: 200px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .album-cover .placeholder {
            font-size: 48px;
            color: #6c757d;
        }
        .album-details {
            padding: 15px;
        }
        .price-input {
            width: 100px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading i {
            font-size: 2em;
            color: #007bff;
        }
        .error-message {
            display: none;
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .success-message {
            display: none;
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .nav-tabs {
            margin-bottom: 20px;
        }
        .price-history {
            font-size: 0.9em;
            color: #6c757d;
        }
        .album-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .album-label i {
            margin-right: 5px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h1>Album Price Management</h1>
                <p class="text-muted">Set prices for your album collection</p>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Error Message -->
        <div id="error" class="alert alert-danger" style="display: none;"></div>

        <!-- Success Message -->
        <div id="success" class="alert alert-success" style="display: none;"></div>

        <!-- Albums Grid -->
        <div id="albumsContainer" class="row"></div>

        <!-- Pagination -->
        <div class="pagination mt-4">
            <button id="prevPage" class="btn btn-outline-primary" onclick="changePage(-1)">Previous</button>
            <span class="pagination-info mx-3">
                Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
            </span>
            <button id="nextPage" class="btn btn-outline-primary" onclick="changePage(1)">Next</button>
        </div>

        <!-- Navigation -->
        <div class="mt-4">
            <a href="/" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Public View
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let totalPages = 1;
        const perPage = 12;

        async function loadAlbums(page = 1) {
            showLoading();
            try {
                console.log(`Loading page ${page}...`);
                const response = await fetch(`/albums?page=${page}&per_page=${perPage}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log('Received data:', data);
                
                // Update pagination info
                currentPage = data.pagination.current_page;
                totalPages = data.pagination.total_pages;
                document.getElementById('currentPage').textContent = currentPage;
                document.getElementById('totalPages').textContent = totalPages;
                
                // Update pagination buttons
                document.getElementById('prevPage').disabled = currentPage === 1;
                document.getElementById('nextPage').disabled = currentPage === totalPages;

                // Clear and populate albums
                const albumsDiv = document.getElementById('albumsContainer');
                albumsDiv.innerHTML = '';
                
                if (!data.albums || data.albums.length === 0) {
                    const noAlbums = document.createElement('div');
                    noAlbums.className = 'col-12 text-center';
                    noAlbums.innerHTML = '<p>No albums found in your collection.</p>';
                    albumsDiv.appendChild(noAlbums);
                } else {
                    console.log(`Rendering ${data.albums.length} albums`);
                    data.albums.forEach(album => {
                        const albumCard = createAlbumCard(album);
                        albumsDiv.appendChild(albumCard);
                    });
                }
            } catch (error) {
                console.error('Error loading albums:', error);
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                loadAlbums(newPage);
            }
        }

        function createAlbumCard(album) {
            const card = document.createElement('div');
            card.className = 'col-md-4 col-lg-3 mb-4';
            
            const content = `
                <div class="card album-card h-100">
                    <div class="album-cover">
                        <img src="${album.thumb || 'https://via.placeholder.com/150'}" 
                             alt="${album.title}" 
                             onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="album-details p-3">
                        <h5 class="card-title">${album.title}</h5>
                        <p class="artist">${album.artist}</p>
                        <p class="year">${album.year}</p>
                        <p class="album-label">
                            <i class="fas fa-record-vinyl"></i>
                            ${album.label}
                        </p>
                        <div class="d-flex align-items-center mb-2">
                            <label class="me-2">Price:</label>
                            <input type="number" 
                                   class="form-control form-control-sm price-input" 
                                   value="${album.price || ''}" 
                                   step="0.01" 
                                   min="0"
                                   onchange="updatePrice('${album.id}', this.value)">
                        </div>
                        ${album.resource_url ? `
                            <a href="${album.resource_url}" target="_blank" class="btn btn-sm btn-outline-primary">
                                <i class="fab fa-discogs"></i> View on Discogs
                            </a>
                        ` : ''}
                    </div>
                </div>
            `;
            
            card.innerHTML = content;
            return card;
        }

        async function updatePrice(albumId, price) {
            try {
                const response = await fetch(`/api/albums/${albumId}/price`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ price: parseFloat(price) || 0 })
                });

                if (!response.ok) {
                    throw new Error('Failed to update price');
                }

                showSuccess('Price updated successfully');
            } catch (error) {
                showError(error.message);
            }
        }

        // Show loading indicator
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }

        // Hide loading indicator
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // Show price management section
        function showPriceManagement() {
            loadAlbums();
        }

        // Initial load
        loadAlbums();
    </script>
</body>
</html>
